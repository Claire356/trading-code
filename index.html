<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Star Skimmer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="Game status">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Wave</span>
          <strong id="wave">1</strong>
        </div>
        <div>
          <span class="label">Lives</span>
          <strong id="lives">3</strong>
        </div>
      </section>

      <canvas id="game" width="960" height="540" aria-label="Star Skimmer game area"></canvas>

      <section id="overlay" class="overlay">
        <h1>Star Skimmer</h1>
        <p id="message">Blast through the field and stay alive.</p>
        <button id="startButton" type="button">Start</button>
      </section>

      <section class="touch-controls" aria-label="Touch controls">
        <button id="leftButton" type="button" aria-label="Move left">&lt;</button>
        <button id="fireButton" type="button" aria-label="Fire">Fire</button>
        <button id="rightButton" type="button" aria-label="Move right">&gt;</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
